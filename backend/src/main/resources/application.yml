spring:
  application:
    name: kadoo-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kadoo}
    username: ${DATABASE_USERNAME:kadoo}
    password: ${DATABASE_PASSWORD:kadoo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # le schéma est géré uniquement par Flyway (NFR-043)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # stockage UTC (NFR-015)
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # erreurs RFC 9457 (contracts/openapi.yaml#Problem)

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true # liveness / readiness (NFR-030)
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs # logs JSON structurés (NFR-060)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false # activé seulement en local
