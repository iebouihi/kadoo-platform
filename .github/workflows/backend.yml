name: backend

on:
  pull_request:
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "contracts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests unitaires, architecture (Modulith + ArchUnit), intégration Testcontainers,
      # format (Spotless) et seuils de couverture (JaCoCo) — NFR-040, NFR-042, NFR-050
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
