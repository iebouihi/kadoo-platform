name: frontend

on:
  pull_request:
    paths: ["frontend/**", "contracts/**", "backend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", "contracts/**", "backend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base des tests e2e de connexion (login.spec.ts), qui passent par le vrai backend.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kadoo
          POSTGRES_USER: kadoo
          POSTGRES_PASSWORD: kadoo
          TZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kadoo" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
      - name: Contrat d'API à jour (NFR-041)
        run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitaires (dont catalogues i18n, NFR-080)
        run: npm test
      - run: npm run build
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests E2E (connexion avec le vrai backend, RTL, accessibilité, en-têtes — KAN-17, NFR-001, NFR-070, NFR-081)
        run: npm run test:e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
